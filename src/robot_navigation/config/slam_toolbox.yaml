slam_toolbox:
  ros__parameters:
    # Cấu hình cơ bản
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # Thông số xử lý bản đồ (Resolution)
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    map_update_interval: 5.0
    
    # Bật TF broadcaster
    enable_interactive_mode: true
    position_search_distance_resolution: 0.02